name: macOS build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test
        run: swift test
      - name: Package disk image
        run: ./Scripts/build-dmg.sh
      - name: Verify disk image
        shell: bash
        run: |
          images=(dist/*.dmg)
          test "${#images[@]}" -eq 1
          hdiutil verify "${images[0]}"
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir"' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" "${images[0]}"
          test "$(readlink "$mount_dir/Applications")" = /Applications
          app="$mount_dir/Cherry.app"
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = Cherry
          icon="$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")"
          test -s "$app/Contents/Resources/$icon"
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          xcrun lipo "$app/Contents/MacOS/MenuShelf" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$app"
      - name: Upload test disk image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: dist/*.dmg
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Build installer package
        run: |
          umask 027
          ./Scripts/build-pkg.sh
      - name: Verify installer package
        shell: bash
        run: |
          packages=(dist/*.pkg)
          test "${#packages[@]}" -eq 1
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          expanded="$verify_dir/expanded"
          pkgutil --expand-full "${packages[0]}" "$expanded"
          component="$expanded/Cherry-component.pkg"
          test "$(xmllint --xpath 'string(/pkg-info/@install-location)' "$component/PackageInfo")" = /Applications
          test "$(xmllint --xpath 'string(/installer-gui-script/title)' "$expanded/Distribution")" = Cherry
          app="$component/Payload/Cherry.app"
          test "$(plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist")" = Cherry
          icon="$(plutil -extract CFBundleIconFile raw "$app/Contents/Info.plist")"
          test -s "$app/Contents/Resources/$icon"
          cmp LICENSE "$app/Contents/Resources/LICENSE"
          xcrun lipo "$app/Contents/MacOS/MenuShelf" -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures "$app"
      - name: Install package and verify access as the runner user
        shell: bash
        run: |
          packages=(dist/*.pkg)
          test "${#packages[@]}" -eq 1
          sudo -n installer -pkg "${packages[0]}" -target /
          pkgutil --pkg-info com.xeromank.menushelf.pkg
          app=/Applications/Cherry.app
          test "$(id -u)" -ne 0
          test "$(stat -f %u "$app")" -eq 0
          test "$(stat -f %Lp "$app")" = 755
          test "$(stat -f %Lp "$app/Contents/_CodeSignature/CodeResources")" = 644
          test -r "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/MenuShelf"
          codesign --verify --strict --all-architectures "$app"
      - name: Upload test installer package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cherry-installer-pkg
          path: dist/*.pkg
          if-no-files-found: error
          retention-days: 14
